[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Renamed from "dicom-rt-viewer" in 1.1.0 (see CHANGELOG). The import
# package is "tk_rt_viewer".
name = "tk-rt-viewer"
dynamic = ["version"]
description = "SimpleITK-based DICOM-RT MPR viewer widget for Tkinter (CT, RT-DOSE, RT-STRUCT, DVH)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "oki1002" }]
keywords = [
    "dicom",
    "dicom-rt",
    "radiotherapy",
    "medical-imaging",
    "mpr",
    "viewer",
    "rt-struct",
    "rt-dose",
    "dvh",
    "simpleitk",
    "tkinter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

dependencies = [
    "SimpleITK>=2.3",
    "contourpy>=1.2",
    # 3.10 added MouseEvent.buttons, used to detect a lost button release
    # (see event_controllers.viewer_events).
    "matplotlib>=3.10",
    # First release supporting Python 3.12.
    "numpy>=1.26",
    "pydicom>=2.4",
    "rt-utils>=1.2",
    "scikit-image>=0.21",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/oki1002/DICOM_RT_Viewer"
Repository = "https://github.com/oki1002/DICOM_RT_Viewer"
Issues = "https://github.com/oki1002/DICOM_RT_Viewer/issues"
Changelog = "https://github.com/oki1002/DICOM_RT_Viewer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Install with: pip install tk-rt-viewer[dev]
dev = [
    "pytest>=7",
    "mypy>=1.0",
    "ruff>=0.6",
]

[tool.hatch.version]
# __init__.__version__ is the single source of truth.
path = "src/tk_rt_viewer/__init__.py"

[tool.hatch.build.targets.wheel]
# src layout; py.typed ships inside the package.
packages = ["src/tk_rt_viewer"]

[tool.mypy]
python_version = "3.12"
# Not --strict: Tk / Matplotlib event-handler parameters stay unannotated,
# but untyped bodies are still checked.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private attributes to pin optimisations (buffer reuse,
# cache identity) that have no public surface.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
